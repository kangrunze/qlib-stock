# 选股池配置

# 排除板块
exclude_boards:
  - "北交所"

# 过滤条件
filters:
  min_listed_days: 250
  exclude_st: true
  exclude_suspended: true
  min_price: 1.0              # 最低股价（元）
  max_price: 1000.0           # 最高股价

# 指数成分股（按优先级）
index_priority:
  - "000300"   # 沪深300
  - "000905"   # 中证500
  - "000852"   # 中证1000

# 行业分类
industry_standard: "shenwan_2014"