# Model Configuration for Stock-AI Quantitative Trading Project
# Phase 3 - Model Training Platform

# ============================================================
# LightGBM Default Parameters
# ============================================================
lightgbm:
  objective: "regression"
  metric: "rmse"
  boosting_type: "gbdt"
  num_leaves: 128
  max_depth: 10
  learning_rate: 0.05
  n_estimators: 1000
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 0.1
  min_child_samples: 20
  random_state: 42
  n_jobs: -1
  verbosity: -1
  early_stopping_rounds: 50

# ============================================================
# XGBoost Default Parameters
# ============================================================
xgboost:
  objective: "reg:squarederror"
  eval_metric: "rmse"
  max_depth: 8
  learning_rate: 0.05
  n_estimators: 1000
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 0.1
  random_state: 42
  n_jobs: -1
  verbosity: 0
  early_stopping_rounds: 50

# ============================================================
# CatBoost Default Parameters
# ============================================================
catboost:
  loss_function: "RMSE"
  eval_metric: "RMSE"
  iterations: 1000
  learning_rate: 0.05
  depth: 8
  l2_leaf_reg: 3.0
  random_seed: 42
  thread_count: -1
  verbose: 0
  early_stopping_rounds: 50

# ============================================================
# Ensemble Configuration
# ============================================================
ensemble:
  weights: [0.5, 0.3, 0.2]  # [lgb, xgb, cat]

# ============================================================
# Optuna Tuning Configuration
# ============================================================
optuna:
  n_trials: 50
  cv_folds: 5
  direction: "maximize"  # maximize RankIC
  timeout: 3600  # seconds

# ============================================================
# SHAP Analysis Configuration
# ============================================================
shap:
  max_display: 20
  sample_size: 1000  # Number of samples for SHAP computation on large datasets

# ============================================================
# Training Configuration
# ============================================================
training:
  test_size: 0.2
  validation_size: 0.2
  random_state: 42
  shuffle: false  # Time series data should not be shuffled by default

# ============================================================
# Model Registry Configuration
# ============================================================
registry:
  storage_path: "models/"
  metadata_filename: "meta.json"
  model_filename: "model.pkl"