# -*- coding: utf-8 -*-
# =============================================================================
# Qlib Pipeline — 中长线低波动配置文件
# =============================================================================
#
# 设计目标：
#   - 年化收益 15%~25%
#   - 最大回撤控制在 15% 以内
#   - 夏普比率 > 1.5
#   - 月频调仓，换手率 < 20%/月
#
# 使用方式：
#   python run.py full --config qlib_pipeline/workflow_config_midlong.yaml
#   python run.py train --config qlib_pipeline/workflow_config_midlong.yaml
#   python run.py backtest --rid <ID> --config qlib_pipeline/workflow_config_midlong.yaml
#
# 与默认配置的差异说明：
#   1. handler:    Alpha158 → Alpha360（因子更丰富，信号更强）
#   2. loss:       mse → rank（排序学习，适合选股而非预测绝对收益）
#   3. topk:       50 → 25（集中持仓，避免摊薄收益）
#   4. n_drop:     5 → 3（低换手率，长线持有）
#   5. 正则化:     加大 L1/L2（抑制过拟合，压低波动）
#   6. 训练期:     4.5 年 → 9.5 年（覆盖一轮完整牛熊周期）
#   7. label:      ret_20d（月度持有期，自然降低换手率）
#   8. 风控:       行业中性化 + 6% 单票上限 + 10% 宽止损
#
# =============================================================================
# 1. Qlib 引擎配置（与默认配置相同，一般不需要改）
# =============================================================================
qlib:
  provider_uri: "d:/project/qlib-stock/qlib_data/cn_data"
  region: "cn"

# =============================================================================
# 2. 数据源配置（与默认配置相同）
# =============================================================================
data_source:
  data_format: "csv"
  csv_dir: "D:/data"
  parquet_dir: "d:/project/qlib-stock/stock-ai/data/daily"
  qlib_dir: "d:/project/qlib-stock/qlib_data/cn_data"
  start_date: "2005-01-01"
  max_workers: 10
  retry_max: 3
  retry_delay: 2

# =============================================================================
# 3. 选股池配置（与默认配置相同）
# =============================================================================
stock_universe:
  exclude_boards: ["北交所"]
  min_listed_days: 250
  exclude_st: true
  exclude_suspended: true

# =============================================================================
# 4. DataHandler 配置 ★ 中长线关键调整
# =============================================================================
# 调整要点：
#   - start_time 提前到 2014 年，为 Alpha360 的长周期因子留足回看期
#   - instruments 用 csi300（大票低波动）或 csi800（兼顾中小盘）
# =============================================================================
data_handler:
  freq: "day"                   # 日线频率（周线需先 --convert --freq week）

  # ★ 数据范围：比训练集早 1 年以上，确保 Alpha360 的 lookback 因子（最长 240 日）有足够数据
  start_time: "2014-01-01"       # 【改】从 2020 提前到 2014，覆盖更长历史
  end_time: "2026-06-26"        # 数据截止日

  # ★ 标准化拟合范围（防未来信息泄露）
  fit_start_time: "2014-01-01"   # 【改】与 start_time 一致，利用全部历史标准化
  fit_end_time: "2023-06-30"     # 不覆盖验证/测试集

  # ★ 股票池选择
  #   csi300 — 沪深 300，大盘蓝筹，天然低波动，适合中长线
  #   csi500 — 中证 500，中盘股，波动略高但弹性更好
  #   csi800 — 中证 800，覆盖沪深 300 + 500，兼顾大中小盘
  #   all    — 全 A 股，标的最多但噪声最大，需配合更严格的正则化
  instruments: "csi300"          # 推荐中长线用 csi300 或 csi800

# =============================================================================
# 5. 数据集配置 ★ 中长线关键调整
# =============================================================================
# 调整要点：
#   - handler 改为 Alpha360（因子更丰富，Rank IC 通常高 2~3 个百分点）
#   - 训练期拉长到 9.5 年，覆盖 2015 牛市、2018 熊市、2020 疫情等完整周期
#   - 验证集/测试集保持不变（1 年 + 1 年）
# =============================================================================
dataset:
  # ★ 特征处理器：Alpha360（360 个因子，覆盖价量、动量、波动率、形态等）
  handler: "Alpha360"            # 【改】Alpha158 → Alpha360

  # ★ 时间段划分
  segments:
    train: ["2015-01-01", "2024-06-30"]    # 【改】9.5 年训练，覆盖完整牛熊
    valid: ["2024-07-01", "2025-06-30"]    # 1 年验证（早停）
    test:  ["2025-07-01", "2026-06-25"]    # 1 年测试

# =============================================================================
# 6. 模型配置 — 自研管线（run.py 不使用，保留备用）
# =============================================================================
model:
  type: "lgb"
  lightgbm:
    objective: "regression"
    metric: "rmse"
    boosting_type: "gbdt"
    num_leaves: 128
    max_depth: 10
    learning_rate: 0.05
    n_estimators: 1000
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 0.1
    min_child_samples: 20
    random_state: 42
    n_jobs: -1
    verbosity: -1
    early_stopping_rounds: 50
  xgboost:
    objective: "reg:squarederror"
    eval_metric: "rmse"
    max_depth: 8
    learning_rate: 0.05
    n_estimators: 1000
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 0.1
    random_state: 42
    n_jobs: -1
    verbosity: 0
    early_stopping_rounds: 50
  catboost:
    loss_function: "RMSE"
    eval_metric: "RMSE"
    iterations: 1000
    learning_rate: 0.05
    depth: 8
    l2_leaf_reg: 3.0
    random_seed: 42
    thread_count: -1
    verbose: 0
    early_stopping_rounds: 50
  ensemble:
    weights: [0.5, 0.3, 0.2]

# =============================================================================
# 7. Qlib 原生 LGB 配置 ★ 中长线关键调整
# =============================================================================
# 调整要点：
#   - loss: mse → rank（排序学习，只关心股票排序，不关心绝对收益值）
#   - learning_rate: 降低学习率，提高模型稳定性
#   - max_depth/num_leaves: 降低模型复杂度，防止过拟合
#   - lambda_l1/lambda_l2: 加大正则化，抑制噪声，压低组合波动
#
# 为什么 rank 比 mse 更适合中长线选股？
#   mse 会让模型花大量精力拟合收益率的绝对值（如 ±1% 的差异），
#   而 rank 只关心"哪只股票涨得更多"，这在预测长周期收益时更稳健。
# =============================================================================
qlib_lgb:
  class: "LGBModel"
  module_path: "qlib.contrib.model.gbdt"
  kwargs:
    loss: "rank"                # 【改】mse → rank（Lambdarank 排序学习）
    colsample_bytree: 0.8       # 【改】0.8879 → 0.8（降低特征采样，增加随机性）
    learning_rate: 0.03         # 【改】0.0421 → 0.03（更慢更稳）
    subsample: 0.8              # 【改】0.8789 → 0.8（同上）
    lambda_l1: 300.0            # 【改】205.7 → 300.0（加大 L1，稀疏化特征权重）
    lambda_l2: 800.0            # 【改】580.9 → 800.0（加大 L2，抑制过拟合）
    max_depth: 7                 # 【改】8 → 7（降低复杂度）
    num_leaves: 128              # 【改】210 → 128（降低叶子数，约 2^7）
    num_threads: 20

# =============================================================================
# 8. Optuna 超参搜索配置
# =============================================================================
optuna:
  n_trials: 100                # 【改】50 → 100（更多搜索次数）
  cv_folds: 5
  direction: "maximize"         # 优化 RankIC
  timeout: 7200                 # 【改】1 小时 → 2 小时

# =============================================================================
# 9. SHAP 可解释性配置（与默认相同）
# =============================================================================
shap:
  max_display: 30               # 【改】20 → 30（Alpha360 因子多，多看几个）
  sample_size: 1000

# =============================================================================
# 10. 策略配置 ★ 中长线关键调整
# =============================================================================
# 调整要点：
#   - topk: 50 → 25（精选持仓，避免分散导致收益被摊薄）
#   - n_drop: 5 → 3（月度只换 12% 仓位，换手率极低）
#   - industry_neutral: 开启行业中性化，分散系统性风险
#   - rebalance_freq: monthly（月频调仓，过滤日间噪声）
#
# 换手率估算：
#   n_drop / topk × freq = 3/25 × 月 = 12%/月，年化约 144%（双向 288%）
#   考虑交易成本（万 2.5 + 万 10）后净摩擦约 1.5%/年，可接受
# =============================================================================
strategy:
  class: "TopkDropoutStrategy"
  module_path: "qlib.contrib.strategy.signal_strategy"
  kwargs:
    topk: 25                    # 【改】50 → 25（精选持仓）
    n_drop: 3                   # 【改】5 → 3（低换手率，每次只换 3 只）
  rebalance_freq: "monthly"     # 月频调仓
  weight_method: "equal"        # 等权分配（简单稳健，适合中长线）
  industry_neutral: true        # 【改】开启行业中性化，避免赌单一行业
  max_stocks_per_industry: 4    # 【改】每行业最多 4 只

# =============================================================================
# 11. 风险控制参数 ★ 中长线关键调整
# =============================================================================
# 调整要点：
#   - max_position_pct: 10% → 6%（25 只等权 = 4%/只，留有余量）
#   - max_industry_pct: 30% → 20%（行业分散）
#   - stop_loss_pct: 8% → 10%（长线容错更大，避免被短期洗盘震出）
# =============================================================================
risk:
  max_position_pct: 0.06       # 【改】10% → 6%（单票不超 6%）
  max_industry_pct: 0.20       # 【改】30% → 20%（单行业不超 20%）
  stop_loss_pct: 0.10           # 【改】8% → 10%（放宽止损线，长线容忍更大回撤）

# =============================================================================
# 12. 回测配置 ★ 中长线关键调整
# =============================================================================
# 调整要点：
#   - backtest.strategy.topk/n_drop 与第 10 节保持一致
#   - deal_price: close → vwap（更贴近实际成交价，避免收盘价滑点）
#   - backtest 时间段通常与 test 段对齐
# =============================================================================
backtest:
  # --- 执行器配置 ---
  executor:
    class: "SimulatorExecutor"
    module_path: "qlib.backtest.executor"
    kwargs:
      time_per_step: "day"
      generate_portfolio_metrics: true

  # --- 回测策略（与第 10 节保持一致） ---
  strategy:
    class: "TopkDropoutStrategy"
    module_path: "qlib.contrib.strategy.signal_strategy"
    kwargs:
      topk: 25                             # 【改】与策略配置一致
      n_drop: 3                            # 【改】与策略配置一致

  # --- 回测交易参数 ---
  backtest:
    start_time: "2025-07-01"
    end_time: "2026-06-25"
    account: 100000000                     # 初始资金 1 亿
    benchmark: "600000"                    # 浦发银行作为基准
    exchange_kwargs:
      freq: "day"
      limit_threshold: 0.095
      deal_price: "close"                  # 成交价: close | vwap（vwap 更贴近实际）
      open_cost: 0.0005                    # 开仓手续费万 2.5
      close_cost: 0.0015                   # 平仓手续费含印花税万 10
      min_cost: 5

# =============================================================================
# 13. 实验配置（与默认相同）
# =============================================================================
experiment:
  name: "qlib_midlong"          # 【改】实验名区分
  mlflow_tracking_uri: "mlruns/"
  log_artifacts: true
  random_seed: 42

# =============================================================================
# 14. 训练配置 — 自研管线（run.py 不使用，保留备用）
# =============================================================================
training:
  test_size: 0.2
  validation_size: 0.2
  shuffle: false
  random_state: 42

# =============================================================================
# 15. 模型注册中心（与默认相同）
# =============================================================================
registry:
  storage_path: "models/"
  metadata_filename: "meta.json"
  model_filename: "model.pkl"

# =============================================================================
# 16. 特征工程配置（与默认相同）
# =============================================================================
features:
  enabled_categories:
    - "fundamental"
    - "fund_flow"
    - "industry"
    - "news"
    - "announcements"
    - "alternative"
  ic_threshold: 0.02
  corr_threshold: 0.95

# =============================================================================
# 17. Label 配置 ★ 中长线关键调整
# =============================================================================
# 调整要点：
#   - primary: ret_20d（月度持有期，20 个交易日 ≈ 1 个月）
#   - 如需更长持有期（季度调仓），可改为 ret_60d
#
# horizon 与调仓频率的关系：
#   horizon=20 + monthly 调仓 → 信号每 20 日刷新一次，自然低换手
#   horizon=60 + quarterly 调仓 → 信号每 60 日刷新，超低换手但信号衰减快
# =============================================================================
labels:
  types:
    - name: "ret_20d"
      horizon: 20                # 20 个交易日 ≈ 1 个月（月度调仓推荐）
      description: "未来20日收益率（月度持有期，适合中长线低换手策略）"
    - name: "ret_60d"
      horizon: 60                # 60 个交易日 ≈ 3 个月（季度调仓可用）
      description: "未来60日收益率（季度持有期，超低换手但预测难度大）"
  primary: "ret_20d"             # ★ 主 Label：20 日收益（月频）
