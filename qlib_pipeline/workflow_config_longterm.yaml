# -*- coding: utf-8 -*-
# =============================================================================
# Qlib 中长周期策略专用配置文件 — workflow_config_longterm.yaml
# =============================================================================
#
# 与 workflow_config.yaml 的关系：
#   - workflow_config.yaml: 短周期默认配置（ret_20d, handler=Alpha158, loss=mse）
#   - 本文件: 中长周期策略配置（ret_60d, handler=Alpha360, loss=rank）
#   - 共用同一套代码（qlib_pipeline/train.py 等），仅配置内容不同
#
# 使用方式:
#   python run.py full --config qlib_pipeline/workflow_config_longterm.yaml
#
# 设计依据: 中长周期选股策略研究系统设计文档 第 5-7 章
# =============================================================================

# =============================================================================
# 1. Qlib 引擎配置
# =============================================================================
qlib:
  # ⚠ provider_uri 必须与 config/settings.yaml:data_source.qlib_dir 保持一致
  provider_uri: "D:/trae/qlib_bin"
  region: "cn"

# =============================================================================
# 2. 数据源配置
# =============================================================================
data_source:
  data_format: "csv"
  csv_dir: "D:/data"
  start_date: "2005-01-01"
  max_workers: 10
  retry_max: 3
  retry_delay: 2

# =============================================================================
# 3. 选股池配置
# =============================================================================
stock_universe:
  exclude_boards: ["北交所"]
  min_listed_days: 250
  exclude_st: true
  exclude_suspended: true

# =============================================================================
# 4. DataHandler 配置 — 中长周期特征 ★
# =============================================================================
# 中长周期需要更长的回看窗口（技术指标如 MA(close, 240) 需要至少 240 天历史）
# 因此 start_time 比短周期配置更早
data_handler:
  freq: "day"
  start_time: "2015-01-01"        # 中长周期: 更早的起始（支持 240 日回看）
  end_time: "2026-07-03"
  fit_start_time: "2015-01-01"    # 标准化拟合起始
  fit_end_time: "2023-06-30"      # 标准化拟合截止（防泄露）
  # ★ 中长周期股票池: 沪深300+中证500 合并（大中盘主流可投资范围）
  instruments: "csi800"

# =============================================================================
# 5. 数据集配置 — 探索/确认两阶段 ★
# =============================================================================
# 中长周期策略采用探索/确认两阶段协议（第 2.2 节 + 第 7.3 节）：
#   - 探索窗口 [2015-2023]: 所有因子筛选、超参搜索、模型对比在此完成
#   - 禁运期 [约 2 个月]: 不用于任何训练
#   - 确认窗口 [2023-2026]: 全程冻结，最终评估一次
dataset:
  handler: "Alpha360"              # ★ 中长周期: Alpha360（更长窗口因子）

  # 探索阶段 segments（第 7.3 节）
  # train/valid 在探索窗口内，test 为确认窗口的一部分
  segments:
    train: ["2015-01-01", "2022-12-31"]    # 探索窗口训练: 约 8 年
    valid: ["2023-01-01", "2023-12-31"]    # 探索窗口验证: 约 1 年
    test:  ["2024-01-01", "2026-07-05"]    # 确认窗口: 约 2.5 年

# =============================================================================
# 6. Qlib 原生 LGB 配置 — 中长周期超参 ★
# =============================================================================
qlib_lgb:
  class: "LGBModel"
  module_path: "qlib.contrib.model.gbdt"
  kwargs:
    loss: "rank"                 # ★ 中长周期: Lambdarank（排序优化，非回归）
    colsample_bytree: 0.8879
    learning_rate: 0.0421
    subsample: 0.8789
    lambda_l1: 205.6999
    lambda_l2: 580.9768
    max_depth: 8
    num_leaves: 210
    num_threads: 20

# =============================================================================
# 7. 回测配置 — 中长周期交易参数 ★
# =============================================================================
backtest:
  executor:
    class: "SimulatorExecutor"
    module_path: "qlib.backtest.executor"
    kwargs:
      time_per_step: "day"
      generate_portfolio_metrics: true

  strategy:
    class: "TopkDropoutStrategy"
    module_path: "qlib.contrib.strategy.signal_strategy"
    kwargs:
      topk: 30                               # ★ 中长周期: 集中持仓 20-30 只
      n_drop: 5

  backtest:
    start_time: "2024-01-01"                 # 确认窗口起始
    end_time: "2026-07-05"
    account: 100000000
    benchmark: "SH000300"                    # 沪深300指数（Phase C 修复后）
    exchange_kwargs:
      freq: "day"
      limit_threshold: 0.095
      deal_price: "close"
      open_cost: 0.0005
      close_cost: 0.0015
      min_cost: 5

# =============================================================================
# 8. 实验配置
# =============================================================================
experiment:
  name: "qlib_longterm"
  mlflow_tracking_uri: "mlruns/"
  log_artifacts: true
  random_seed: 42

# =============================================================================
# 9. Label 配置 — 中长周期标签体系 ★
# =============================================================================
# 第 5.1 节标签清单:
#   ret_60d: 季调仓主标签（当前 primary）
#   ret_120d: 半年调仓标签
#   ret_20d: 保留用于诊断（是否录入短期动量/反转效应）
#   alpha_20d/60d/120d: 相对指数超额收益（依赖 Phase C 基准修复）
#   xs_ret_20d/60d/120d: 相对全池中位数超额收益（训练口径候选）
#   up_down_60d: 事后诊断字段，不作为独立训练目标（第 5.3 节）
#
# 第 5.2 节双基准并存原则:
#   训练时 xs_ret_Nd 优先: 剔除大盘贝塔和共同风格，训练目标更纯粹
#   报告时 alpha_Nd 保留: 业务方理解"是否跑赢基准"
#
# 第 5.4 节 primary 显式声明:
#   本配置的 primary 是 ret_60d（季度调仓主标签）
#   其余标签是"计算并归档、供事后诊断"的辅助字段
# =============================================================================
labels:
  types:
    - name: "ret_60d"
      horizon: 60
      description: "未来60日收益率（季度调仓主标签）"
    - name: "ret_120d"
      horizon: 120
      description: "未来120日收益率（半年调仓）"
    - name: "ret_20d"
      horizon: 20
      description: "未来20日收益率（诊断用）"
    - name: "alpha_20d"
      horizon: 20
      description: "相对基准超额收益（20日，报告口径，依赖 Phase C）"
    - name: "alpha_60d"
      horizon: 60
      description: "相对基准超额收益（60日，报告口径，依赖 Phase C）"
    - name: "alpha_120d"
      horizon: 120
      description: "相对基准超额收益（120日，报告口径，依赖 Phase C）"
    - name: "xs_ret_20d"
      horizon: 20
      description: "相对全池中位数收益（20日，训练口径候选）"
    - name: "xs_ret_60d"
      horizon: 60
      description: "相对全池中位数收益（60日，训练口径候选）"
    - name: "xs_ret_120d"
      horizon: 120
      description: "相对全池中位数收益（120日，训练口径候选）"
    - name: "up_down_60d"
      horizon: 60
      description: "方向判断标签（60日，事后诊断字段，不作为独立训练目标）"
  primary: "ret_60d"             # ★ 中长周期主标签: 季度调仓（第 5.4 节）